  <body>
    <div id="error-log" style="color: red; position: fixed; top: 0; left: 0; z-index: 9999; background: white; padding: 20px; max-height: 100vh; overflow-y: auto;"></div>
    <script>
      window.onerror = function(msg, url, line, col, error) {
        document.getElementById('error-log').innerHTML += '<p><strong>Error:</strong> ' + msg + '<br/>Location: ' + url + ':' + line + ':' + col + '<br/>' + (error && error.stack ? error.stack.replace(/\\n/g, '<br/>') : '') + '</p>';
      };
      window.addEventListener('unhandledrejection', function(event) {
        document.getElementById('error-log').innerHTML += '<p><strong>Unhandled Promise:</strong> ' + (event.reason ? event.reason.toString() : 'Unknown reason') + '<br/>' + (event.reason && event.reason.stack ? event.reason.stack.replace(/\\n/g, '<br/>') : '') + '</p>';
      });
    </script>
    <div id="root"></div>
